AWSTemplateFormatVersion: '2010-09-09'
Description: GateFlow dev/test environment - isolated VPC and Aurora Serverless v2 Postgres. Dev only, no production data.

Parameters:
  EnvName:
    Type: String
    Default: gateflow-dev

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Ref EnvName}
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}
        - {Key: ManagedBy, Value: CloudFormation}

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${EnvName}-a'}
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${EnvName}-b'}
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: GateFlow dev database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GateFlow dev database access - VPC internal only, no public ingress
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.42.0.0/16
          Description: Postgres from inside this VPC only
      Tags:
        - {Key: Name, Value: !Sub '${EnvName}-db'}
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvName}/database'
      Description: GateFlow dev database master credentials, generated by CloudFormation
      GenerateSecretString:
        SecretStringTemplate: '{"username":"gateflow_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '17.5'
      DatabaseName: gateflow
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 2
        SecondsUntilAutoPause: 3600
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}
        - {Key: ManagedBy, Value: CloudFormation}

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

Outputs:
  VpcId:
    Value: !Ref Vpc
  DbEndpoint:
    Value: !GetAtt DbCluster.Endpoint.Address
  DbSecretArn:
    Value: !Ref DbSecret
