AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Veri-Gate service - sign-in (Cognito), the API (API Gateway HTTP API + Lambda) and the migration
  runner. Talks to the gateflow-dev database through the RDS Data API; the database itself stays
  unreachable from the internet. CR-V17-AWS-CONNECT-001.

Parameters:
  EnvName:
    Type: String
    Default: gateflow-dev
  ClusterArn:
    Type: String
    Description: The Aurora cluster from the gateflow-dev stack.
  SecretArn:
    Type: String
    Description: The database credential from the gateflow-dev stack (DbSecretArn output).
  DatabaseName:
    Type: String
    Default: gateflow
  AllowedOrigins:
    Type: CommaDelimitedList
    # capacitor://localhost is the iOS scheme, and API Gateway rejects it as an origin anyway.
    Description: Web origins allowed to call the API. The Android app loads from https://localhost.
    Default: 'https://gateflow-prototype.vercel.app,http://localhost:8800,https://localhost'

Resources:

  # --- Sign-in --------------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${EnvName}-users'
      # Nobody signs themselves up. The Admin creates every login.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      # A locked-out operator asks the Admin; there is no email reset to phish.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: admin_only, Priority: 1}
      UserPoolTags:
        Project: GateFlow
        Environment: dev

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${EnvName}-app'
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # A handheld at a gate should not need its password re-entered every shift. Step 5: each phone
      # is signed in once by the Admin and stays signed in; 180 days means the Admin re-signs a phone in
      # twice a year. Turning a login off in the Users tab still stops it at once (global sign-out).
      RefreshTokenValidity: 180
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}

  # Roles as Cognito groups, most senior first. The API reads them from the token.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Admin, Precedence: 1, Description: 'Creates users and owns the location override switches'}
  SupervisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Supervisor, Precedence: 2, Description: 'Manages drivers, vehicles, devices and authorizations'}
  FleetLeadGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: FleetLead, Precedence: 3, Description: 'Can approve a Vehicle OUT override'}
  ScannerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Scanner, Precedence: 4, Description: 'Records gate movements'}
  DeviceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: Device, Precedence: 5, Description: 'A handheld signed in as itself rather than as a person'}

  # --- Functions ------------------------------------------------------------------------------

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        # This database and this credential, through the Data API, and nothing else.
        - PolicyName: veri-gate-data-api
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'rds-data:ExecuteStatement'
                  - 'rds-data:BatchExecuteStatement'
                  - 'rds-data:BeginTransaction'
                  - 'rds-data:CommitTransaction'
                  - 'rds-data:RollbackTransaction'
                Resource: !Ref ClusterArn
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Ref SecretArn
        # Step 5: the Admin makes and manages logins from the app. This pool only; no deleting.
        - PolicyName: veri-gate-logins
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'cognito-idp:ListUsers'
                  - 'cognito-idp:ListUsersInGroup'
                  - 'cognito-idp:AdminListGroupsForUser'
                  - 'cognito-idp:AdminCreateUser'
                  - 'cognito-idp:AdminAddUserToGroup'
                  - 'cognito-idp:AdminRemoveUserFromGroup'
                  - 'cognito-idp:AdminDisableUser'
                  - 'cognito-idp:AdminEnableUser'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminUserGlobalSignOut'
                Resource: !GetAtt UserPool.Arn
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvName}-api'
      Description: Veri-Gate API
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: handler.handler
      Code: ../build/api
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      # API Gateway gives up at 30 seconds.
      Timeout: 29
      Environment:
        Variables:
          CLUSTER_ARN: !Ref ClusterArn
          SECRET_ARN: !Ref SecretArn
          DATABASE_NAME: !Ref DatabaseName
          STAGE: dev
          USER_POOL_ID: !Ref UserPool
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvName}-api'
      RetentionInDays: 30

  # Invoked on demand, never through the API: aws lambda invoke --function-name gateflow-dev-migrate
  MigrateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvName}-migrate'
      Description: Applies pending Veri-Gate database migrations
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: migrate.handler
      Code: ../build/api
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          CLUSTER_ARN: !Ref ClusterArn
          SECRET_ARN: !Ref SecretArn
          DATABASE_NAME: !Ref DatabaseName
      Tags:
        - {Key: Project, Value: GateFlow}
        - {Key: Environment, Value: dev}

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvName}-migrate'
      RetentionInDays: 90

  # --- API ------------------------------------------------------------------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${EnvName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type, idempotency-key]
        MaxAge: 600
      Tags:
        Project: GateFlow
        Environment: dev

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /health'
      Target: !Sub 'integrations/${LambdaIntegration}'

  # Every /v1 route needs a valid sign-in token; the function routes within it.
  #
  # These are listed one method at a time on purpose. A single 'ANY /v1/{proxy+}' route also
  # matches the OPTIONS request a browser sends before a cross-origin call, and that request
  # carries no token by design - so the authorizer rejected it and the console saw "no
  # connection" instead of its records. Leaving OPTIONS unmatched lets API Gateway answer the
  # preflight itself from the CORS settings above.
  V1GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /v1/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub 'integrations/${LambdaIntegration}'

  V1PostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub 'integrations/${LambdaIntegration}'

  V1PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /v1/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub 'integrations/${LambdaIntegration}'

  V1PatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PATCH /v1/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub 'integrations/${LambdaIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MigrateFunctionName:
    Value: !Ref MigrateFunction
